<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Whitehall map</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="whitehall.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&amp;family=JetBrains+Mono:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="wh" style="padding: {{pad}}; background: transparent">
  <section class="mp" aria-label="Map">

    <div class="mp-h">
      <div style="min-width: 0">
        <p class="eyebrow">{{tag}}</p>
        <h2 class="h2">{{heading}}</h2>
      </div>
      <div class="row">
        <sc-if value="{{isCensus}}" hint-placeholder-val="{{false}}">
          <select class="sel" value="{{metric}}" onChange="{{onMetric}}" aria-label="Colour the map by">
            <option value="inc">Median household income</option>
            <option value="pov">Below the poverty line</option>
            <option value="ba">Bachelor's degree or higher</option>
            <option value="a65">Age 65 and over</option>
            <option value="hisp">Hispanic or Latino</option>
            <option value="pop">Total population</option>
          </select>
        </sc-if>
        <sc-if value="{{isPastYear}}" hint-placeholder-val="{{false}}">
          <select class="sel" value="{{year}}" onChange="{{onYear}}" aria-label="Presidential election year">
            <option value="2024">2024 President</option>
            <option value="2020">2020 President</option>
          </select>
        </sc-if>
      </div>
    </div>

    <div class="mp-tabs" role="group" aria-label="Map layer">
      <sc-for list="{{layers}}" as="l" hint-placeholder-count="7">
        <button type="button" onClick="{{l.pick}}" aria-pressed="{{l.pressed}}" disabled="{{l.dis}}" title="{{l.title}}">{{l.label}}</button>
      </sc-for>
    </div>

    <div class="mp-frame" style="--mp-h: {{frameStyle}}">
      <canvas id="{{uid}}" ref="{{setCanvas}}" tabindex="0" role="img" aria-label="{{mapAria}}"></canvas>

      <div class="seg mp-geo" role="group" aria-label="Geography">
        <sc-for list="{{geos}}" as="g" hint-placeholder-count="3">
          <button type="button" class="btn sm" onClick="{{g.pick}}" aria-pressed="{{g.pressed}}">{{g.label}}</button>
        </sc-for>
      </div>

      <div class="mp-zoom">
        <button type="button" class="btn" onClick="{{zoomIn}}" aria-label="Zoom in">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>
        </button>
        <button type="button" class="btn" onClick="{{zoomOut}}" aria-label="Zoom out">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 8h10"></path></svg>
        </button>
        <button type="button" class="btn" onClick="{{reset}}" aria-label="Reset the view">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2.5 6V2.5H6M13.5 10v3.5H10M2.5 10v3.5H6M13.5 6V2.5H10"></path></svg>
        </button>
      </div>

      <div class="seg mp-jump" role="group" aria-label="Jump to">
        <button type="button" class="btn sm" onClick="{{goL48}}" aria-label="Show the lower 48 states">48</button>
        <button type="button" class="btn sm" onClick="{{goAK}}" aria-label="Show Alaska">AK</button>
        <button type="button" class="btn sm" onClick="{{goHI}}" aria-label="Show Hawaii">HI</button>
      </div>

      <div class="mp-base">Shapes: U.S. Census Bureau, Natural Earth</div>

      <div id="{{tipId}}" class="{{tipCls}}">
        <strong>{{tipTitle}}</strong>
        <sc-for list="{{tipLines}}" as="ln" hint-placeholder-count="0">
          <div>{{ln.t}}</div>
        </sc-for>
      </div>
      <div class="{{hintCls}}" aria-hidden="true">{{hint}}</div>
    </div>

    <div class="mp-foot">
      <div class="legend">
        <sc-for list="{{legend}}" as="g" hint-placeholder-count="5">
          <span><i class="{{g.cls}}" style="background-color: {{g.bg}}; border: {{g.bd}}; border-radius: {{g.rad}}"></i><sc-if value="{{g.two}}" hint-placeholder-val="{{false}}"><i class="{{g.cls2}}" style="background-color: {{g.bg2}}; border-radius: {{g.rad2}}"></i></sc-if>{{g.label}}</span>
        </sc-for>
      </div>

      <sc-if value="{{hasNotes}}" hint-placeholder-val="{{false}}">
        <div class="row" style="gap: 6px 10px; align-items: baseline">
          <sc-for list="{{notes}}" as="n" hint-placeholder-count="0">
            <span class="{{n.cls}}" style="font-size: 11.5px">{{n.text}}</span>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{selOn}}" hint-placeholder-val="{{false}}">
        <div class="mp-sel" aria-live="polite">
          <span class="chip mk num">{{selTag}}</span>
          <strong>{{selTitle}}</strong>
          <sc-for list="{{selLines}}" as="ln" hint-placeholder-count="2">
            <span>{{ln.t}}</span>
          </sc-for>
          <span style="margin-left: auto; display: flex; gap: 14px">
            <sc-if value="{{canOpen}}" hint-placeholder-val="{{false}}"><button type="button" class="lnk" onClick="{{open}}">{{openLabel}}</button></sc-if>
            <button type="button" class="lnk" onClick="{{clearSel}}">Clear</button>
          </span>
        </div>
      </sc-if>
      <sc-if value="{{selNone}}" hint-placeholder-val="{{true}}">
        <p class="small" style="margin: 0">Select a place to mark it and read its figures here. Drag to move the map. Zoom with the buttons, a pinch, or Ctrl or ⌘ and scroll.</p>
      </sc-if>

      <dc-import name="SourceLine" src="{{src}}" asof="{{asof}}" what="{{what}}" note="{{note}}" hint-size="100%,22px"></dc-import>
    </div>
  </section>
</div>
</x-dc>

      x += rd(); y += rd();
      let lon = x * WH_Q; if (lon > 0) lon -= 360;
      pts[2 * j] = whMx(lon); pts[2 * j + 1] = whMy(y * WH_Q);
    }
    arcs[a] = pts;
  }
  const rr = whReader(src.r);
  const ids = src.ids.split(','), names = src.names.split('|');
  return ids.map((id, i) => {
    const nR = rr();
    const rings = [];
    let x0 = 9, y0 = 9, x1 = -9, y1 = -9, best = -1, lab = [0, 0];
    for (let r = 0; r < nR; r++) {
      const nArc = rr();
      const out = [];
      for (let q = 0; q < nArc; q++) {
        const ref = rr();
        const arc = arcs[ref < 0 ? -ref - 1 : ref];
        const n = arc.length / 2;
        for (let j = 0; j < n; j++) {
          const jj = ref < 0 ? n - 1 - j : j;
          if (j === 0 && out.length) continue;
          out.push(arc[2 * jj], arc[2 * jj + 1]);
        }
      }
      let a = 0, cx = 0, cy = 0, bx0 = 9, bx1 = -9, by0 = 9, by1 = -9;
      for (let j = 0; j < out.length - 2; j += 2) {
        const f = out[j] * out[j + 3] - out[j + 2] * out[j + 1];
        a += f; cx += (out[j] + out[j + 2]) * f; cy += (out[j + 1] + out[j + 3]) * f;
      }
      for (let j = 0; j < out.length; j += 2) {
        if (out[j] < bx0) bx0 = out[j]; if (out[j] > bx1) bx1 = out[j];
        if (out[j + 1] < by0) by0 = out[j + 1]; if (out[j + 1] > by1) by1 = out[j + 1];
      }
      if (bx0 < x0) x0 = bx0; if (bx1 > x1) x1 = bx1; if (by0 < y0) y0 = by0; if (by1 > y1) y1 = by1;
      if (Math.abs(a) > best) { best = Math.abs(a); lab = a ? [cx / (3 * a), cy / (3 * a)] : [(bx0 + bx1) / 2, (by0 + by1) / 2]; }
      rings.push(out);
    }
    const st = kind === 'c' ? WH_FIPS[id.slice(0, 2)] : id.slice(0, 2);
    return { i, id, kind, st, name: kind === 'd' ? '' : names[i], rings, bb: [x0, y0, x1, y1], lab, path: null };
  });
}

function whGeo(kind) {
  if (!WH_CACHE) WH_CACHE = { geo: {} };
  if (!WH_CACHE.geo[kind]) {
    const src = kind === 's' ? { a: WH_SA, r: WH_SR, ids: WH_SI, names: WH_SN } : kind === 'd' ? { a: WH_DA, r: WH_DR, ids: WH_DI, names: '' } : kind === 'n' ? { a: WH_NA, r: WH_NR, ids: WH_NI, names: WH_NN } : { a: WH_CA, r: WH_CR, ids: WH_CI, names: WH_CN };
    const feats = whDecode(src, kind);
    const by = {};
    feats.forEach((f) => { by[f.id] = f; });
    WH_CACHE.geo[kind] = { feats, by };
  }
  return WH_CACHE.geo[kind];
}

/* The invented record behind every layer. The House and Senate outcomes follow the same
   rules as the replay screen, so the map, the call log and the overview table agree. */
function whWorld() {
  if (WH_CACHE && WH_CACHE.world) return WH_CACHE.world;
  if (!WH_CACHE) WH_CACHE = { geo: {} };
  const S = {}, H = {};
  const names = {};
  whGeo('s').feats.forEach((f) => { names[f.id] = f.name; });
  WH_RAW.split(' ').forEach((s) => {
    const p = s.split(':');
    const st = { ab: p[0], n: +p[1], d: +p[2], unc: +p[3], close: +p[4], sen: p[5] };
    st.name = names[st.ab] || st.ab;
    st.lean = WH_LEAN[st.ab] + Math.round((whHash('ln' + st.ab) - 0.5) * 50) / 10;
    st.cert = WH_CERT.indexOf(st.ab) >= 0 ? 'cert' : WH_COUNTING.indexOf(st.ab) >= 0 ? 'count' : 'canv';
    if (st.sen !== '-') {
      st.senStep = WH_SENCALL[st.ab] || st.close + 1;
      const fx = WH_SENFIX[st.ab];
      st.senM = fx ? fx[0] : (st.sen === 'd' ? 1 : -1) * (6 + Math.round(whHash('sm' + st.ab) * 220) / 10);
      st.senDrift = fx ? fx[1] : Math.round((whHash('sd' + st.ab) - 0.5) * 80) / 10;
      st.senGain = st.ab === 'NC' || st.ab === 'ME';
      st.senHolder = st.senGain ? (st.sen === 'd' ? 'r' : 'd') : st.sen;
      st.senOpen = WH_SENOPEN.indexOf(st.ab) >= 0;
      st.senMk = whMarket(st.ab + '-SEN', st.senM, true);
    }
    st.tariff = st.ab === 'HI' ? null : Math.round(8 + whHash('tf' + st.ab) * 84);
    S[st.ab] = st;
    const pin = WH_PIN[st.ab] || {};
    const order = [];
    for (let i = 1; i <= st.n; i++) order.push({ i, h: whHash(st.ab + i) });
    order.sort((a, b) => a.h - b.h);
    let nd = st.d, nu = st.unc;
    Object.keys(pin).forEach((k) => { if (pin[k] === 'd') nd--; if (pin[k] === 'u') nu--; });
    let k = 0;
    order.forEach((o) => {
      const party = pin[o.i] || (k < nd ? 'd' : k < nd + nu ? 'u' : 'r');
      if (!pin[o.i]) k++;
      const code = st.ab + '-' + (st.n === 1 ? '00' : whPad(o.i));
      const h2 = whHash('c' + st.ab + o.i), h3 = whHash('l' + st.ab + o.i);
      let step = st.close + 1 + Math.floor(h2 * (6 + st.n * 0.4));
      if (h3 < (st.ab === 'CA' ? 0.3 : 0.1)) step = 49 + Math.floor(whHash('d' + st.ab + o.i) * 9);
      step = Math.min(57, step);
      if (WH_PINSTEP[code]) step = WH_PINSTEP[code];
      const close = whHash('m' + code) < 0.14;
      let m = WH_PINM[code];
      if (m == null) m = (party === 'd' ? 1 : -1) * (close ? 0.4 + Math.round(whHash('M' + code) * 36) / 10 : 4 + Math.round(whHash('M' + code) * 360) / 10);
      const win = party === 'u' ? (m > 0 ? 'd' : 'r') : party;
      const gain = party !== 'u' && whHash('g' + st.ab + o.i) < 0.07;
      H[code] = {
        code, ab: st.ab, i: o.i, party, step, m, gain, close: st.close,
        drift: Math.round((whHash('dr' + code) - 0.5) * 160) / 10,
        holder: party === 'u' ? 'r' : gain ? (win === 'd' ? 'r' : 'd') : win,
        open: whHash('o' + code) < 0.1,
        redist: WH_REDIST.indexOf(st.ab) >= 0,
        mk: whMarket(code, m, whHash('k' + code) < 0.81),
        past: whHash('un' + code) < 0.05 ? 'un' : (party === 'u' || !gain ? (win === 'd' ? 1 : -1) : (win === 'd' ? -1 : 1)) * (3 + Math.round(whHash('p4' + code) * 340) / 10)
      };
    });
  });
  S.DC = { ab: 'DC', name: 'District of Columbia', n: 0, sen: '-', lean: 84, cert: 'canv', close: 8, tariff: null };
  H['DC-00'] = null;
  H['PA-01'].past = -12.4;
  const ranked = Object.keys(S).filter((k) => S[k].tariff != null).sort((a, b) => S[b].tariff - S[a].tariff);
  ranked.forEach((k, i) => { S[k].tariffRank = i + 1; });
  WH_CACHE.world = { S, H, scored: ranked.length };
  return WH_CACHE.world;
}

function whMarket(code, m, priced) {
  if (!priced) return null;
  const upset = Math.abs(m) < 3 && whHash('u' + code) < 0.3;
  const win = m > 0 ? 'd' : 'r';
  return upset ? { lead: win === 'd' ? 'r' : 'd', price: Math.round(52 + whHash('up' + code) * 14) }
    : { lead: win, price: Math.min(99, Math.round(53 + Math.abs(m) * 3.6 + whHash('pr' + code) * 6)) };
}

/* share of the final count reported at step T: the same definition the replay's tables use */
const WH_SLOW = 'CA AZ NV WA OR AK UT NY CO'.split(' ');
const whCounted = (T, close, ab) => {
  if (T <= close) return 0;
  const slow = WH_SLOW.indexOf(ab) >= 0;
  const speed = (slow ? 12 : 4.5) + whHash('sp' + ab) * (slow ? 10 : 7);
  const tail = slow ? 0.78 + whHash('tl' + ab) * 0.12 : 0.955 + whHash('tl' + ab) * 0.035;
  if (T <= 48) return (tail * (1 - Math.exp(-(T - close) / speed))) / (1 - Math.exp(-(48 - close) / speed));
  const days = slow ? 3 + Math.floor(whHash('dd' + ab) * 6) : 1 + Math.floor(whHash('dd' + ab) * 3);
  return Math.min(1, tail + (1 - tail) * Math.pow(Math.min(1, (T - 48) / days), 0.7));
};

/* What a race looks like at replay step T, or in the record as it stands (T == null). */
function whRace(final, drift, step, close, T, uncalled, ab) {
  if (T == null) return uncalled ? { s: 'lead', p: final > 0 ? 'd' : 'r', m: final, c: null } : { s: 'called', p: final > 0 ? 'd' : 'r', m: final, c: null };
  if (T < close) return { s: 'open' };
  const c = whCounted(T, close, ab);
  if (c < 0.004) return { s: 'novotes', c: 0 };
  if (!uncalled && T >= step) return { s: 'called', p: final > 0 ? 'd' : 'r', m: final + drift * Math.pow(1 - c, 1.5), c, just: T - step <= 1 };
  const m = final + drift * Math.pow(1 - c, 1.5);
  return { s: 'lead', p: m >= 0 ? 'd' : 'r', m, c };
}

class Component extends DCLogic {
  componentDidMount() { this.attach(); }
  componentDidUpdate() { this.attach(); this.queueDraw(); }
  componentWillUnmount() {
    this._dead = true;
    if (this._ro) this._ro.disconnect();
    if (this._mo) this._mo.disconnect();
    if (this._hintTimer) clearTimeout(this._hintTimer);
    const cv = this._cv;
    if (cv && this._on) Object.keys(this._on).forEach((k) => cv.removeEventListener(k, this._on[k]));
    if (this._onUp) { window.removeEventListener('pointerup', this._onUp); window.removeEventListener('pointermove', this._onMove); }
  }

  uid() { if (!this._uid) this._uid = 'whm' + Math.floor(Math.random() * 1e9).toString(36); return this._uid; }

  /* ---------- view ---------- */
  size() { const cv = this._cv; return cv ? [cv.clientWidth || 0, cv.clientHeight || 0] : [0, 0]; }

  fitBounds(b, pad) {
    const [W, H] = this.size();
    if (!W || !H) return;
    const x0 = whMx(b[0][0]), x1 = whMx(b[1][0]), y0 = whMy(b[1][1]), y1 = whMy(b[0][1]);
    this.fitBox([x0, y0, x1, y1], pad);
  }

  fitBox(bb, pad) {
    const [W, H] = this.size();
    if (!W || !H) return;
    const p = pad == null ? 18 : pad;
    const k = Math.min((W - 2 * p) / Math.max(1e-9, bb[2] - bb[0]), (H - 2 * p) / Math.max(1e-9, bb[3] - bb[1]));
    this.v = { cx: (bb[0] + bb[2]) / 2, cy: (bb[1] + bb[3]) / 2, k: Math.max(this.kMin(), Math.min(this.kMax(), k)) };
  }

  kMin() { return 180; }
  kMax() { return 256 * 2048; }

  boxFor(code) {
    if (!code) return null;
    if (code === 'L48') return null;
    if (code === 'AK') return 'AK';
    if (code.length === 2) {
      const f = whGeo('s').by[code];
      return f ? f.bb : null;
    }
    const g = code.indexOf('-') > 0 ? whGeo('d') : whGeo('c');
    const f = g.by[code];
    return f ? f.bb : null;
  }

  home() {
    const fit = this.props.fit;
    const box = this.boxFor(fit);
    if (box === 'AK') this.fitBounds(WH_AK);
    else if (box) this.fitBox(box, 26);
    else this.fitBounds(WH_L48, 10);
  }

  zoomAt(factor, sx, sy) {
    const [W, H] = this.size();
    const v = this.v; if (!v) return;
    const px = sx == null ? W / 2 : sx, py = sy == null ? H / 2 : sy;
    const wx = v.cx + (px - W / 2) / v.k, wy = v.cy + (py - H / 2) / v.k;
    const k = Math.max(this.kMin(), Math.min(this.kMax(), v.k * factor));
    v.cx = wx - (px - W / 2) / k; v.cy = wy - (py - H / 2) / k; v.k = k;
    this.clampView();
    this._touched = true;
    this.queueDraw();
  }

  clampView() {
    const v = this.v;
    v.cx = Math.max(-0.03, Math.min(0.34, v.cx));
    v.cy = Math.max(0.17, Math.min(0.47, v.cy));
  }

  /* ---------- wiring ---------- */
  attach() {
    if (this._dead) return;
    let cv = this._cv;
    if (!cv || !cv.isConnected) cv = this._cv = (typeof document !== 'undefined' && document.getElementById(this.uid())) || null;
    if (!cv) { if (!this._retry) this._retry = setTimeout(() => { this._retry = null; this.attach(); }, 120); return; }
    if (this._wired === cv) return;
    this._wired = cv;

    const on = this._on = {};

    on.pointerdown = (e) => {
      if (e.pointerType === 'touch') return;
      const p = pos(e);

    };

      drag.moved = true; this._touched = true;
      v.cx -= dx / v.k; v.cy -= dy / v.k; drag.x = p[0]; drag.y = p[1];

    };
    this._onUp = (e) => {
      if (!drag) return;
      const was = drag; drag = null; cv.style.cursor = '';

    };

    on.pointerleave = () => { this.hoverAt(-1, -1); };
    on.click = (e) => { if (this._lastTouch && Date.now() - this._lastTouch < 700) { const p = pos(e); this.pickAt(p[0], p[1]); } };

      e.preventDefault();
      const p = pos(e);
      this.zoomAt(Math.pow(2, -e.deltaY / (e.ctrlKey && Math.abs(e.deltaY) < 40 ? 60 : 320)), p[0], p[1]);
    };

    const tinfo = (e) => {
      const r = cv.getBoundingClientRect(), a = e.touches[0], b = e.touches[1];

    };

      }
    };
    on.touchend = (e) => { if (e.touches.length < 2) tt = null; };
    on.keydown = (e) => {
      const v = this.v; if (!v) return;

    }

    this.home();
    this.queueDraw();
    [300, 1200, 3000].forEach((ms) => setTimeout(() => { if (!this._dead) { if (!this._touched) this.home(); this.queueDraw(); } }, ms));
  }

  hint(text) {
    if ((this.state || {}).hint !== text) this.setState({ hint: text });
    if (this._hintTimer) clearTimeout(this._hintTimer);
    this._hintTimer = setTimeout(() => { if (!this._dead) this.setState({ hint: '' }); }, 1800);
  }

  /* ---------- colours, read from the Whitehall tokens ---------- */
  palette() {
    const cv = this._cv;
    const cs = getComputedStyle(cv);
    const g = (n, d) => (cs.getPropertyValue(n) || '').trim() || d;
    const P = {
      paper: g('--paper', '#F7F8F7'), paper2: g('--paper-2', '#ECEEEC'), ink: g('--ink', '#121517'), ink2: g('--ink-2', '#3A4043'), ink3: g('--ink-3', '#596063'),
      hair: g('--hair', '#C6CAC3'), mark: g('--mark', '#FFD84A'), dem: g('--dem', '#1F56B3'), rep: g('--rep', '#DC6428'), oth: g('--oth', '#7B8087'),
      d1: g('--d1', '#C5D3EE'), d2: g('--d2', '#7F9FDA'), d3: g('--d3', '#2F5FB8'), r1: g('--r1', '#F3CDB9'), r2: g('--r2', '#E49466'), r3: g('--r3', '#B8501F'),
      zero: g('--zero', '#DFE2DB'), hatch: g('--hatch', 'rgba(18,21,23,.3)'), onDem: g('--on-dem', '#fff'), onRep: g('--on-rep', '#121517'),
      q: [g('--q1', '#E4E6E1'), g('--q2', '#C2C6C0'), g('--q3', '#969C97'), g('--q4', '#666D6C'), g('--q5', '#33393B')]
    };
    P.dark = this.lum(P.paper) < 0.3;
    const sig = [P.paper, P.ink, P.dem, P.rep, P.zero, P.q[0], P.q[4], P.hatch].join('|');
    if (this._pal && this._palSig === sig) return this._pal;
    this._palSig = sig; this._pal = P; this._pat = {};
    return P;
  }

  lum(c) {
    let r = 0, g = 0, b = 0;
    if (c[0] === '#') { const h = c.length === 4 ? c.replace(/#(.)(.)(.)/, '#$1$1$2$2$3$3') : c; r = parseInt(h.slice(1, 3), 16); g = parseInt(h.slice(3, 5), 16); b = parseInt(h.slice(5, 7), 16); }
    else { const m = c.match(/[\d.]+/g) || [0, 0, 0]; r = +m[0]; g = +m[1]; b = +m[2]; }
    const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
  }

  inkOn(fill, P) {
    if (!fill) return P.ink;
    const L = this.lum(fill), a = this.lum(P.ink), b = this.lum(P.paper);
    const ca = (Math.max(L, a) + 0.05) / (Math.min(L, a) + 0.05), cb = (Math.max(L, b) + 0.05) / (Math.min(L, b) + 0.05);

  }

  pattern(ctx, color, wide, scale) {
    if (!this._pat) this._pat = {};
    const key = color + (wide ? 'w' : 'n');
    let p = this._pat[key];
    if (!p) {
      const d = this._dpr || 1, n = Math.round(6 * d);

      c.width = n; c.height = n;
      const x = c.getContext('2d');
      x.strokeStyle = color; x.lineWidth = (wide ? 2.2 : 1) * d; x.lineCap = 'square';
      x.beginPath(); x.moveTo(-n, 0); x.lineTo(0, n); x.moveTo(0, 0); x.lineTo(n, n); x.moveTo(n, 0); x.lineTo(2 * n, n); x.stroke();
      p = this._pat[key] = ctx.createPattern(c, 'repeat');
    }
    if (p && p.setTransform && typeof DOMMatrix !== 'undefined') p.setTransform(new DOMMatrix([scale, 0, 0, scale, 0, 0]));
    return p;
  }

  /* ---------- the model for the current layer ---------- */
  cfg() {
    const p = this.props;
    const extra = p.extra || null;
    const vk = (p.viewKey || '') + '|' + (extra ? extra.id + (extra.geo || '') + (extra.state || '') : '');
    if (this._vk !== vk) {
      const had = this._vk !== undefined && this.state && (this.state.geo || this.state.layer || this.state.sel);
      this._vk = vk;
      if (had) { this._stale = true; setTimeout(() => { this._stale = false; if (!this._dead) this.setState({ geo: '', layer: '', sel: null, hover: '' }); }, 0); }
    }
    const st = this._stale ? {} : (this.state || {});
    const geo = st.geo || p.startGeo || (extra && extra.geo) || 'states';
    let layer = st.layer || p.startLayer || (extra ? extra.id : 'results');
    const ok = (id) => (extra && id === extra.id ? !extra.geo || extra.geo === geo : geo === 'counties' ? id === 'past' || id === 'census' : geo === 'districts' ? id !== 'tariff' : true);
    let fell = '';
    if (!ok(layer)) { fell = layer; layer = geo === 'counties' ? 'past' : 'results'; }
    const T = p.step == null || p.step === '' ? null : +p.step;
    const metric = st.metric || 'inc';
    const year = geo === 'districts' ? 2024 : +(st.year || 2024);
    const sel = p.sel !== undefined && p.sel !== null ? this.resolve(p.sel, geo, extra) : st.sel || (st.sel === '' ? '' : this.resolve(p.startSel, geo, extra));
    return { extra, geo, layer, ok, fell, T, metric, year, sel, kind: geo === 'states' ? 's' : geo === 'districts' ? 'd' : 'c' };
  }

  resolve(key, geo, extra) {
    if (!key) return '';
    const kind = geo === 'states' ? 's' : geo === 'districts' ? 'd' : 'c';
    const g = whGeo(kind);
    if (g.by[key]) return key;
    if (kind === 'c' && extra && extra.state) { const f = this.byName(extra.state)[String(key).toLowerCase()]; if (f) return f.id; }
    if (kind === 's' && key.length > 2 && g.by[key.slice(0, 2)]) return key.slice(0, 2);
    return '';
  }

  byName(ab) {
    if (!this._names) this._names = {};
    if (!this._names[ab]) { const m = {}; whGeo('c').feats.forEach((f) => { if (f.st === ab) m[f.name.toLowerCase()] = f; }); this._names[ab] = m; }
    return this._names[ab];
  }

  /* census value for one feature: null where the Census has no row for the shape drawn */
  census(f, metric) {
    if (f.kind === 'c' && f.st === 'CT') return null;
    if (f.id === '42017' && metric === 'inc') return 107.8;
    if (f.id === '42017' && metric === 'ba') return 42.1;
    const M = WH_METRICS.filter((m) => m[0] === metric)[0];
    const h = whHash(metric + f.id), h2 = whHash('z' + metric + f.id);
    if (metric === 'pop') return f.kind === 's' ? Math.round((0.6 + h * h * 30) * 1e6) : f.kind === 'd' ? Math.round(745000 + h * 60000) : Math.round(900 + Math.pow(h, 5) * 2.4e6 + h2 * 30000);
    return Math.round((M[2] + (M[3] - M[2]) * (0.25 * h + 0.75 * h * h2 + (f.kind === 's' ? 0.18 : 0)) * (f.kind === 's' ? 0.8 : 1)) * 10) / 10;
  }

  breaks(kind, metric) {
    if (!this._brk) this._brk = {};
    const key = kind + metric;
    if (!this._brk[key]) {
      const vals = whGeo(kind).feats.map((f) => this.census(f, metric)).filter((v) => v != null).sort((a, b) => a - b);
      this._brk[key] = [0.2, 0.4, 0.6, 0.8].map((q) => vals[Math.floor(vals.length * q)]).concat([vals[0], vals[vals.length - 1], vals[Math.floor(vals.length / 2)]]);
    }
    return this._brk[key];
  }

  fmt(metric, v) {
    const M = WH_METRICS.filter((m) => m[0] === metric)[0];
    if (v == null) return 'No figure';
    if (M[4] === 'usd') return '$' + Math.round(v * 1000).toLocaleString('en-US');
    if (M[4] === 'pct') return v.toFixed(1) + '%';
    return Math.round(v).toLocaleString('en-US');
  }

  pastOf(f, year) {
    const W = whWorld();
    if (f.kind === 's') { const s = W.S[f.id]; return s ? s.lean + (year === 2020 ? 3 + (whHash('y20' + f.id) - 0.5) * 5 : 0) : null; }
    if (f.kind === 'd') { const h = W.H[f.id]; return h ? h.past : null; }
    if (f.st === 'AK') return null;
    if (f.id === '42017') return year === 2020 ? 4.4 : -0.3;
    const s = W.S[f.st]; if (!s) return null;
    const u = whHash('u' + f.id), n = whHash('n' + f.id);
    const eff = u > 0.9 ? 16 + n * 26 : u > 0.72 ? -2 + n * 20 : -24 + n * 20;
    return Math.max(-88, Math.min(88, Math.round((s.lean * 0.75 + eff + (year === 2020 ? 3 + (whHash('y20' + f.id) - 0.5) * 6 : 0)) * 10) / 10));
  }

  raceOf(f, c) {
    const W = whWorld();
    if (f.kind === 's') { const s = W.S[f.id]; return s && s.sen !== '-' ? Object.assign({ st: s, holder: s.senHolder, open: s.senOpen, mk: s.senMk, redist: false, cut: s.close }, whRace(s.senM, s.senDrift, s.senStep, s.close, c.T, false, s.ab)) : null; }
    const h = W.H[f.id];
    return h ? Object.assign({ st: W.S[h.ab], h, holder: h.holder, open: h.open, mk: h.mk, redist: h.redist, cut: h.close }, whRace(h.m, h.drift, h.step, h.close, c.T, h.party === 'u', h.ab)) : null;
  }

  priceOf(r, c) {
    if (!r || !r.mk) return null;
    const mk = r.mk;
    if (c.T == null || r.s === 'open' || r.s === 'novotes') return { lead: mk.lead, price: mk.price };
    if (r.s === 'called') return { lead: r.p, price: 99 };
    const final = (r.h ? r.h.m : r.st.senM) > 0 ? 'd' : 'r';
    const cc = r.c * r.c;
    let pr = mk.lead === final ? mk.price + (97 - mk.price) * cc : mk.price - (mk.price - 4) * cc;
    let lead = mk.lead;
    if (pr < 50) { pr = 100 - pr; lead = lead === 'd' ? 'r' : 'd'; }
    return { lead, price: Math.round(pr) };
  }

  /* style of one feature: fill, hatch (colour + weight), edge (solid, dash, dot) */
  styleOf(f, c, P) {
    const none = { fill: P.paper, edge: null };
    const nodata = { fill: P.paper, edge: 'dash' };
    const L = c.layer;
    if (c.extra && L === c.extra.id) {
      const ex = c.extra;
      const key = f.kind === 'c' && ex.state ? (f.st === ex.state ? f.name : null) : f.id;
      if (key == null || (ex.state && f.st !== ex.state)) return { fill: P.paper, edge: null, out: true };
      let v = ex.values ? ex.values[key] : undefined;
      if (v === undefined) v = ex.fallback;
      const dim = ex.dim && ex.dim[key];
      if (v === undefined || v === null || v === 'out') return { fill: P.paper, edge: null, out: true };
      if (v === 'na') return nodata;
      if (v === 'ex') return { fill: P.zero, hatch: P.hatch, dim };
      if (v === 'cert') return { fill: P.ink };
      if (v === 'canv') return { fill: P.paper, edge: 'solid' };
      if (v === 'count') return { fill: P.zero, hatch: P.hatch };
      const a = Math.abs(v);
      return { fill: a < 1 ? P.zero : P[(v > 0 ? 'd' : 'r') + (a < 3 ? 1 : a < 6 ? 2 : 3)], dim };
    }
    if (L === 'census') {
      const v = this.census(f, c.metric);
      if (v == null) return nodata;
      const b = this.breaks(c.kind, c.metric);
      return { fill: P.q[v < b[0] ? 0 : v < b[1] ? 1 : v < b[2] ? 2 : v < b[3] ? 3 : 4] };
    }
    if (L === 'tariff') {
      const s = whWorld().S[f.id];
      if (!s || s.tariff == null) return nodata;
      return { fill: P.q[Math.min(4, Math.floor(s.tariff / 20))] };
    }
    if (L === 'past') {
      const m = this.pastOf(f, c.year);
      if (m == null) return nodata;
      if (m === 'un') return { fill: P.zero, hatch: P.hatch };
      const a = Math.abs(m);
      return { fill: P[(m > 0 ? 'd' : 'r') + (a < 5 ? 1 : a < 15 ? 2 : 3)] };
    }
    const r = this.raceOf(f, c);
    if (!r) return none;
    if (L === 'holder') {
      const col = r.holder === 'd' ? (r.open ? P.d2 : P.dem) : (r.open ? P.r2 : P.rep);
      return { fill: col, redist: r.redist };
    }
    if (L === 'market') {
      const pr = this.priceOf(r, c);
      if (!pr) return nodata;
      return { fill: P[pr.lead + (pr.price >= 90 ? 3 : pr.price >= 75 ? 2 : 1)], redist: r.redist, tag: pr.price + '¢' };
    }
    if (r.s === 'open') return { fill: P.paper, edge: 'dash' };
    if (r.s === 'novotes') return { fill: P.zero, hatch: P.hatch, redist: r.redist };
    if (L === 'flip') {
      if (r.redist) return { fill: P.paper, edge: 'dot', redist: true };
      if (r.p !== r.holder) return r.s === 'called' ? { fill: r.p === 'd' ? P.dem : P.rep, just: r.just } : { fill: P.paper, hatch: r.p === 'd' ? P.dem : P.rep, wide: true };
      return Math.abs(r.m) < 3 ? { fill: P.zero, edge: 'solid' } : { fill: P.zero };
    }
    if (r.s === 'called') return { fill: r.p === 'd' ? P.dem : P.rep, just: r.just, redist: r.redist };
    return { fill: P.paper, hatch: r.p === 'd' ? P.dem : P.rep, wide: true, redist: r.redist };
  }

  /* the words for one feature: title and up to four lines */
  describe(f, c) {
    const W = whWorld();
    const L = c.layer;
    const st = W.S[f.st] || {};
    const isD = f.kind === 'd', isC = f.kind === 'c';
    const dcode = isD ? (f.id.slice(3) === '00' ? f.st + ' at large' : f.id) : '';
    const title = isC ? f.name + (f.st === 'LA' ? ' Parish' : f.st === 'AK' ? '' : ' County') + ', ' + f.st : isD ? dcode + ' · U.S. House' : f.name;
    const mf = (m) => (Math.abs(m) < 0.05 ? 'Even' : (m > 0 ? 'D+' : 'R+') + Math.abs(m).toFixed(1));
    const pn = (p) => (p === 'd' ? 'Democrat' : 'Republican');
    const pa = (p) => (p === 'd' ? 'Democratic' : 'Republican');
    const lines = [];
    let tag = isC ? f.name : isD ? (f.id.slice(3) === '00' ? f.st + '-AL' : f.id) : f.id;
    if (c.extra && L === c.extra.id) {
      const ex = c.extra;
      const key = isC && ex.state ? f.name : f.id;
      let v = ex.values ? ex.values[key] : undefined;
      if (isC && ex.state && f.st !== ex.state) v = 'out';
      if (v === undefined) v = ex.fallback;
      if (v === 'out' || v == null) lines.push(ex.outText || 'Outside this comparison');
      else if (v === 'na') lines.push(ex.naText || 'Boundaries changed; not comparable');
      else if (v === 'ex') lines.push('Excluded: unopposed race, no two-sided margin');
      else if (v === 'cert') lines.push('Certified by the state');
      else if (v === 'canv') lines.push('Awaiting certification');
      else if (v === 'count') lines.push('A race in this state is still counting');
      else { lines.push('Swing ' + (Math.abs(v) < 0.05 ? '0.0' : '+' + Math.abs(v).toFixed(1) + (v > 0 ? ' D' : ' R')) + ' points'); if (ex.pair) lines.push(ex.pair); }
      if (ex.lines && ex.lines[key]) lines.push(ex.lines[key]);
      return { title, lines, tag };
    }
    if (L === 'census') {
      const M = WH_METRICS.filter((m) => m[0] === c.metric)[0];
      const v = this.census(f, c.metric);
      if (v == null) lines.push('No figure: the Census reports Connecticut by planning region, and these are county shapes');
      else { lines.push(M[1] + ': ' + this.fmt(c.metric, v)); lines.push('Middle ' + (isC ? 'county' : isD ? 'district' : 'state') + ': ' + this.fmt(c.metric, this.breaks(c.kind, c.metric)[6])); }
      lines.push('ACS 2020–2024 five-year estimate');
      return { title, lines, tag };
    }
    if (L === 'tariff') {
      const s = W.S[f.id];
      if (!s || s.tariff == null) lines.push('Not scored: fewer than 3 of the 4 measures');
      else { lines.push('Exposure ' + s.tariff + ' / 100 · rank ' + s.tariffRank + ' of ' + W.scored); lines.push('An exposure score, not a measured cost'); }
      return { title, lines, tag };
    }
    if (L === 'past') {
      const m = this.pastOf(f, c.year);
      lines.push(c.year + (isD ? ' U.S. House' : ' President'));
      if (m == null) lines.push(f.st === 'AK' ? 'Not reported by county: Alaska reports by state house district' : 'Not reported for this area');
      else if (m === 'un') lines.push('Won unopposed: no vote count reported');
      else lines.push(pn(m > 0 ? 'd' : 'r') + ' won by ' + Math.abs(m).toFixed(1) + ' points (' + mf(m) + ')');
      if (isD && W.H[f.id] && W.H[f.id].redist) lines.push('2024 lines, as drawn. The 2026 district is different');
      return { title, lines, tag };
    }
    if (isC) { lines.push('Counties have no 2026 race of their own'); return { title, lines, tag }; }
    const r = this.raceOf(f, c);
    if (!r) { lines.push(isD ? 'No voting seat in the House' : 'No Senate race in 2026'); return { title, lines, tag }; }
    if (!isD) tag = f.id + '-SEN';
    const role = (p) => pa(p) + (r.open ? ' nominee' : p === r.holder ? ' incumbent' : ' challenger');
    if (L === 'holder') {
      lines.push(pn(r.holder) + '-held before Nov 3' + (r.open ? (isD ? ' · open seat' : ' · open seat, incumbent not running') : ''));
      if (r.redist) lines.push('Redrawn for 2026: the holder represents the 2024 lines drawn here');
      return { title: isD ? title : f.name + ' · U.S. Senate', lines, tag };
    }
    if (L === 'market') {
      const pr = this.priceOf(r, c);
      if (!pr) lines.push('No market or no price');
      else { lines.push(role(pr.lead) + ' ' + pr.price + '¢ · last traded price'); lines.push('Market price (Kalshi). A price is not a forecast'); }
      if (r.redist) lines.push('Shape shows 2024 lines; the market is for the 2026 district');
      return { title: isD ? title : f.name + ' · U.S. Senate', lines, tag };
    }
    const tt = isD ? title : f.name + ' · U.S. Senate';
    if (r.s === 'open') { lines.push('Polls open: no results yet'); return { title: tt, lines, tag }; }
    if (r.s === 'novotes') { lines.push('Polls closed. No votes in the newest snapshot'); return { title: tt, lines, tag }; }
    if (L === 'flip') {
      if (r.redist) lines.push('Redrawn for 2026: not compared with the holder of the old lines');
      else if (r.p !== r.holder) lines.push((r.s === 'called' ? 'Flipped: called for the ' : 'Leader differs from the holder: ') + role(r.p) + (r.s === 'called' ? '' : ', not called'));
      else lines.push(pn(r.holder) + ' hold' + (r.s === 'called' ? '' : ', not called') + (Math.abs(r.m) < 3 ? ' · within 3 points' : ''));
      lines.push('Margin ' + mf(r.m) + ' · holder before Nov 3: ' + pn(r.holder));
      return { title: tt, lines, tag };
    }
    lines.push((r.s === 'called' ? (c.T == null ? 'Won by the ' : 'Called for the ') : 'Leading, not called: ') + role(r.p) + ' · ' + mf(r.m));
    if (r.c != null) lines.push(Math.round(r.c * 100) + '% of the final count reported');
    if (c.T == null) lines.push(r.s === 'called' ? (st.cert === 'cert' ? 'Certified by the state' : 'Called by civicAPI’s decision desk · uncertified') : 'No call yet · still counting');
    else if (r.s === 'called') lines.push('Call: civicAPI’s decision desk');
    if (r.redist) lines.push('Shape shows 2024 lines; the result is for the 2026 district');
    return { title: tt, lines, tag };
  }

  /* ---------- hit testing ---------- */
  featAt(sx, sy) {
    const v = this.v; if (!v || sx < 0) return null;
    const [W, H] = this.size();
    const x = v.cx + (sx - W / 2) / v.k, y = v.cy + (sy - H / 2) / v.k;
    const c = this._cfg; if (!c) return null;
    const feats = whGeo(c.kind).feats;
    for (let i = 0; i < feats.length; i++) {
      const f = feats[i], b = f.bb;
      if (x < b[0] || x > b[2] || y < b[1] || y > b[3]) continue;
      let inside = false;
      for (let r = 0; r < f.rings.length; r++) {
        const p = f.rings[r];
        for (let a = 0, q = p.length - 2; a < p.length; q = a, a += 2) {
          if ((p[a + 1] > y) !== (p[q + 1] > y) && x < ((p[q] - p[a]) * (y - p[a + 1])) / (p[q + 1] - p[a + 1]) + p[a]) inside = !inside;
        }
      }
      if (inside) return f;
    }
    return null;
  }

  hoverAt(sx, sy) {
    const f = this.featAt(sx, sy);
    const id = f ? f.id : '';
    const tip = this._tipEl || (typeof document !== 'undefined' && document.getElementById(this.uid() + 't'));
    if (tip && f) {
      const [W] = this.size();
      const left = sx > W * 0.6;
      tip.style.left = left ? '' : Math.round(sx + 14) + 'px';
      tip.style.right = left ? Math.round(W - sx + 14) + 'px' : '';
      tip.style.top = Math.round(Math.max(6, sy - 10)) + 'px';
    }
    if (id !== this._hover) { this._hover = id; this.setState({ hover: id }); this.queueDraw(); }
  }

  pickAt(sx, sy) {
    const f = this.featAt(sx, sy);
    const c = this._cfg;
    if (!f) { this.setState({ sel: '' }); return; }
    this.setState({ sel: f.id });
    const cb = this.props.onPick;
    if (cb) cb({ id: f.id, name: f.name, kind: f.kind, state: f.st });
  }

  /* ---------- drawing ---------- */
  queueDraw() {
    if (this._raf || this._dead) return;
    const run = () => { this._raf = null; try { this.draw(); } catch (err) { if (typeof console !== 'undefined') console.error('[WhMap] draw failed', err); } };
    this._raf = typeof requestAnimationFrame !== 'undefined' ? requestAnimationFrame(run) : setTimeout(run, 16);
  }

  pathOf(f) {
    if (f.path) return f.path;
    const p = new Path2D();
    f.rings.forEach((r) => { p.moveTo(r[0], r[1]); for (let j = 2; j < r.length; j += 2) p.lineTo(r[j], r[j + 1]); p.closePath(); });
    f.path = p;
    return p;
  }

  draw() {
    const cv = this._cv;
    if (!cv || !cv.isConnected) { this.attach(); return; }
    const [W, H] = this.size();
    if (!W || !H) return;
    if (!this.v) this.home();
    const v = this.v; if (!v) return;
    const c = this._cfg || this.cfg();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if (this._dpr !== dpr) { this._dpr = dpr; this._pat = {}; }
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    const ctx = cv.getContext('2d');
    const P = this.palette();
    const k = v.k, tx = W / 2 - v.cx * k, ty = H / 2 - v.cy * k;
    const world = () => ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * tx, dpr * ty);
    const screen = () => ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    screen();
    ctx.globalAlpha = 1;
    ctx.fillStyle = P.paper2;
    ctx.fillRect(0, 0, W, H);
    const g = whGeo(c.kind);
    const vb = [v.cx - W / 2 / k, v.cy - H / 2 / k, v.cx + W / 2 / k, v.cy + H / 2 / k];
    const vis = [];
    for (let i = 0; i < g.feats.length; i++) { const b = g.feats[i].bb; if (b[2] >= vb[0] && b[0] <= vb[2] && b[3] >= vb[1] && b[1] <= vb[3]) vis.push(g.feats[i]); }
    const key = [c.layer, c.geo, c.T, c.metric, c.year, P.paper, c.extra ? c.extra.rev : ''].join('|');
    if (this._styleKey !== key) { this._styleKey = key; this._styles = {}; }
    const S = this._styles;
    const sOf = (f) => S[f.id] || (S[f.id] = this.styleOf(f, c, P));
    world();
    /* neighbouring land, so the country sits on a map and not on a blank sheet */
    const nb = whGeo('n').feats;
    ctx.globalAlpha = 0.55; ctx.fillStyle = P.paper;
    for (let i = 0; i < nb.length; i++) ctx.fill(this.pathOf(nb[i]), 'evenodd');
    ctx.globalAlpha = 1; ctx.strokeStyle = P.hair; ctx.lineWidth = 0.8 / k;
    for (let i = 0; i < nb.length; i++) ctx.stroke(this.pathOf(nb[i]));
    const pscale = 1 / (dpr * k);
    for (let i = 0; i < vis.length; i++) {
      const f = vis[i], s = sOf(f), path = this.pathOf(f);
      ctx.globalAlpha = s.dim ? 0.25 : s.out ? 0.6 : 1;
      ctx.fillStyle = s.fill; ctx.fill(path, 'evenodd');
      if (s.hatch) { ctx.fillStyle = this.pattern(ctx, s.hatch, s.wide, pscale); ctx.fill(path, 'evenodd'); }
    }
    ctx.globalAlpha = 1;
    ctx.lineJoin = 'round';
    ctx.lineWidth = (c.kind === 's' ? 0.9 : 0.5) / k;
    ctx.strokeStyle = c.kind === 's' ? P.ink3 : P.hair;
    for (let i = 0; i < vis.length; i++) ctx.stroke(this.pathOf(vis[i]));
    const edges = { dash: [], dot: [], solid: [], redist: [], just: [] };
    for (let i = 0; i < vis.length; i++) { const s = sOf(vis[i]); if (s.edge) edges[s.edge].push(vis[i]); if (s.redist && c.kind === 'd') edges.redist.push(vis[i]); if (s.just) edges.just.push(vis[i]); }
    const strokeAll = (list, color, w, dash) => {
      if (!list.length) return;
      ctx.strokeStyle = color; ctx.lineWidth = w / k; ctx.setLineDash(dash ? dash.map((d) => d / k) : []);
      for (let i = 0; i < list.length; i++) ctx.stroke(this.pathOf(list[i]));
      ctx.setLineDash([]);
    };
    strokeAll(edges.solid, P.ink, 1.4);
    strokeAll(edges.dash, P.ink3, 1.2, [4, 3]);
    strokeAll(edges.dot, P.ink3, 1.3, [1.2, 2.4]);
    if (c.kind !== 's') {
      const sf = whGeo('s').feats;
      ctx.strokeStyle = P.ink2; ctx.lineWidth = 0.9 / k;
      for (let i = 0; i < sf.length; i++) { const b = sf[i].bb; if (b[2] >= vb[0] && b[0] <= vb[2] && b[3] >= vb[1] && b[1] <= vb[3]) ctx.stroke(this.pathOf(sf[i])); }
      if (c.kind === 'd' && edges.redist.length) {
        const seen = {};
        ctx.strokeStyle = P.ink; ctx.lineWidth = 1.8 / k; ctx.setLineDash([5 / k, 3 / k]);
        edges.redist.forEach((f) => { if (!seen[f.st]) { seen[f.st] = 1; const sfe = whGeo('s').by[f.st]; if (sfe) ctx.stroke(this.pathOf(sfe)); } });
        ctx.setLineDash([]);
      }
    }
    const ring = (f, outer, inner) => {
      const path = this.pathOf(f);
      ctx.strokeStyle = P.ink; ctx.lineWidth = outer / k; ctx.stroke(path);
      ctx.strokeStyle = P.mark; ctx.lineWidth = inner / k; ctx.stroke(path);
    };
    edges.just.forEach((f) => ring(f, 4.5, 2.5));
    const hov = this._hover && g.by[this._hover];
    if (hov) { ctx.strokeStyle = P.ink; ctx.lineWidth = 1.8 / k; ctx.stroke(this.pathOf(hov)); }
    const sel = c.sel && g.by[c.sel];
    const mk = this.props.mark;
    const markF = mk ? (mk.indexOf('-') > 0 ? whGeo('d').by[mk] : whGeo('s').by[mk.slice(0, 2)]) : null;
    if (markF && (!sel || sel.id !== markF.id)) ring(markF, 5, 3);
    if (sel) ring(sel, 5, 3);

    screen();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const mono = "'JetBrains Mono', ui-monospace, Menlo, monospace";
    if (c.kind !== 'c') {
      for (let i = 0; i < vis.length; i++) {
        const f = vis[i], b = f.bb, s = sOf(f);
        const w = (b[2] - b[0]) * k, h = (b[3] - b[1]) * k;
        const text = c.kind === 's' ? f.id : f.id.slice(3) === '00' ? 'AL' : String(+f.id.slice(3));
        const need = c.kind === 's' ? 26 : 30;
        if (w < need || h < 16 || (c.kind === 'd' && k < 900)) continue;
        const x = f.lab[0] * k + tx, y = f.lab[1] * k + ty;
        if (x < 8 || y < 8 || x > W - 8 || y > H - 8) continue;
        const solid = s.fill && !s.hatch && s.fill !== P.paper;
        ctx.font = '600 ' + (c.kind === 's' ? 10.5 : 10) + 'px ' + mono;
        if (!solid) { ctx.lineWidth = 3; ctx.strokeStyle = P.paper; ctx.strokeText(text, x, y - (s.tag ? 5 : 0)); }
        ctx.fillStyle = solid ? this.inkOn(s.fill, P) : P.ink;
        ctx.globalAlpha = s.out ? 0.5 : 1;
        ctx.fillText(text, x, y - (s.tag ? 5 : 0));
        if (s.tag && w > 34 && h > 28) { ctx.font = '500 9.5px ' + mono; ctx.fillText(s.tag, x, y + 7); }
        ctx.globalAlpha = 1;
      }
    }
    const tagFor = (b, text) => {
      ctx.font = '700 11px ' + mono;
      const tw = Math.ceil(ctx.measureText(text).width) + 14, th = 20;
      const cx = ((b[0] + b[2]) / 2) * k + tx;
      const top = b[1] * k + ty, bottom = b[3] * k + ty;
      if (bottom > 0 && top < H && cx > -40 && cx < W + 40) {
        let bx = Math.max(4, Math.min(W - tw - 4, cx - tw / 2));
        let by = top - th - 9;
        const below = by < 4;
        if (below) by = Math.min(H - th - 4, bottom + 9);
        ctx.strokeStyle = P.ink; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(cx, below ? by : by + th); ctx.lineTo(cx, below ? bottom + 1 : top - 1); ctx.stroke();
        ctx.fillStyle = P.mark; ctx.fillRect(bx, by, tw, th);
        ctx.strokeStyle = '#121517'; ctx.lineWidth = 1.5; ctx.strokeRect(bx + 0.5, by + 0.5, tw - 1, th - 1);
        ctx.fillStyle = '#121517'; ctx.fillText(text, bx + tw / 2, by + th / 2 + 0.5);
      }
    };
    if (markF && (!sel || sel.id !== markF.id)) tagFor(markF.bb, markF.kind === 'd' && markF.id.slice(3) === '00' ? markF.st + '-AL' : this.props.mark);
    if (sel) tagFor(sel.bb, this.describe(sel, c).tag);
  }

  /* ---------- the template's inputs ---------- */
  renderVals() {
    const st = this.state || {}, p = this.props;
    const c = this.cfg();
    this._cfg = c;
    if (this._fitKey !== (p.fit || '')) { this._fitKey = p.fit || ''; this._touched = false; if (this.v) this.home(); }
    const W = whWorld();
    const g = whGeo(c.kind);
    const T = c.T;
    const replay = T != null;
    const moment = p.asof || 'Nov 26, 2026, 9:00 AM ET';
    const unit = c.geo === 'states' ? 'state' : c.geo === 'districts' ? 'district' : 'county';
    const chamber = c.geo === 'districts' ? 'House' : 'Senate';
    const L = c.layer;
    const M = WH_METRICS.filter((m) => m[0] === c.metric)[0];
    const pressed = (b) => (b ? 'true' : 'false');
    const setLayer = (id) => () => this.setState({ layer: id });
    const setGeo = (id) => () => { this._hover = ''; this.setState({ geo: id, hover: '', sel: this.props.sel != null ? st.sel : '' }); };

    const layers = [];
    const push = (id, label) => {
      const ok = c.ok(id);
      layers.push({ id, label, pressed: pressed(L === id), dis: !ok, pick: setLayer(id), title: ok ? label : id === 'tariff' ? 'Tariff exposure is by state: pick States' : c.geo === 'counties' ? 'Counties have no 2026 race: pick States or Districts' : 'Not available for this geography' });
    };
    if (c.extra && !c.extra.last) push(c.extra.id, c.extra.label);
    WH_LAYERS.forEach((l) => push(l[0], l[1]));
    if (c.extra && c.extra.last) push(c.extra.id, c.extra.label);

    /* heading, legend and source for the layer on show */
    let tag = '', heading = '', src = '', asof = moment, what = '', note = '';
    const legend = [];
    const sw = (label, bg, o) => legend.push(Object.assign({ label, bg: bg || 'transparent', bd: '0', rad: '0', cls: '', two: false, bg2: 'transparent', rad2: '0', cls2: '' }, o || {}));
    const notes = [];
    const anyRedist = c.geo === 'districts';
    if (c.extra && L === c.extra.id) {
      const ex = c.extra;
      tag = ex.tag || ''; heading = ex.heading || ex.label; src = ex.src || ''; asof = ex.asof || moment; what = ex.what || heading; note = ex.note || '';
      if (ex.scale === 'cert') {
        sw('Certified' + (ex.counts ? ' (' + ex.counts[0] + ')' : ''), 'var(--ink)');
        sw('Awaiting certification' + (ex.counts ? ' (' + ex.counts[1] + ')' : ''), 'transparent', { bd: '1.5px solid var(--ink)' });
        sw('A race still counting' + (ex.counts ? ' (' + ex.counts[2] + ')' : ''), 'var(--zero)', { cls: 'hatch-bg' });
      } else {
        sw('6+ toward Democrats', 'var(--d3)'); sw('3 to 6', 'var(--d2)'); sw('1 to 3', 'var(--d1)'); sw('under 1', 'var(--zero)');
        sw('1 to 3', 'var(--r1)'); sw('3 to 6', 'var(--r2)'); sw('6+ toward Republicans', 'var(--r3)');
        sw('Excluded: unopposed race', 'var(--zero)', { cls: 'hatch-bg' });
        sw('Not comparable', 'transparent', { bd: '1.5px dashed var(--ink-3)' });
      }
      if (ex.chip) notes.push({ cls: 'chip dash', text: ex.chip });
    } else if (L === 'results') {
      tag = chamber + (chamber === 'House' ? ' · 435 seats' : ' · 35 races') + ' · civicAPI count and calls';
      heading = replay ? '2026 ' + chamber + ' count at this moment · called or leading' : '2026 ' + chamber + ' result · called or leading';
      src = 'civicAPI result snapshots and race calls' + (replay ? ', from the locked Nov 3 record' : '; counts from state election offices');
      what = chamber + ' results map'; note = 'Calls are civicAPI’s decision desk’s, not Whitehall’s';
      sw('Called, Democrat', 'var(--dem)'); sw('Called, Republican', 'var(--rep)', { rad: '50%' });
      sw('Leading, not called', 'transparent', { cls: 'hatch-d', two: true, cls2: 'hatch-r' });
      if (replay) { sw('Polls closed, no votes yet', 'var(--zero)', { cls: 'hatch-bg' }); sw('Polls open', 'transparent', { bd: '1.5px dashed var(--ink-3)' }); sw('Just called', 'transparent', { bd: '0', cls: 'just-sw' }); }
      if (chamber === 'Senate') sw('No Senate race', 'var(--paper)', { bd: '1px solid var(--hair)' });
    } else if (L === 'market') {
      tag = chamber + ' · Kalshi, hourly snapshots of the last traded price';
      heading = 'Market leader by ' + unit + ' · prices, not forecasts';
      src = 'Market price (Kalshi, hourly). Last traded price'; what = chamber + ' market leader map'; note = 'A price is not a forecast';
      asof = replay ? 'the hourly snapshot at or before ' + moment : '6:00 PM ET, Nov 3, 2026, the scorecard cut-off';
      sw('Democrat leads, 90¢ or more', 'var(--d3)'); sw('75 to 90¢', 'var(--d2)'); sw('under 75¢', 'var(--d1)');
      sw('Republican leads, 90¢ or more', 'var(--r3)'); sw('75 to 90¢', 'var(--r2)'); sw('under 75¢', 'var(--r1)');
      sw('No market or no price', 'transparent', { bd: '1.5px dashed var(--ink-3)' });
      if (chamber === 'Senate') sw('No Senate race', 'var(--paper)', { bd: '1px solid var(--hair)' });
    } else if (L === 'holder') {
      tag = chamber + (chamber === 'House' ? ' · 435 seats' : ' · the 35 seats on the ballot') + ' · holders before the election';
      heading = 'Who held the seat before Nov 3';
      src = 'Clerk of the House and Secretary of the Senate rosters, entered by Whitehall editors'; asof = 'Nov 2, 2026'; what = chamber + ' seat holder map';
      sw('Democrat-held', 'var(--dem)'); sw('Republican-held', 'var(--rep)', { rad: '50%' });
      sw(chamber === 'House' ? 'Open or vacant seat, by last holder' : 'Open seat, incumbent not running', 'var(--d2)', { two: true, bg2: 'var(--r2)', rad2: '50%' });
      if (chamber === 'Senate') sw('No Senate race', 'var(--paper)', { bd: '1px solid var(--hair)' });
    } else if (L === 'flip') {
      let flips = 0, leads = 0, tight = 0;
      g.feats.forEach((f) => { const r = this.raceOf(f, c); if (!r || !r.p || r.redist) return; if (r.p !== r.holder) { if (r.s === 'called') flips++; else leads++; } else if (Math.abs(r.m) < 3) tight++; });
      tag = chamber + ' · result so far against the seat holder';
      heading = 'Flip watch · result against seat holder';
      src = 'civicAPI result snapshots and race calls; seat holders entered by Whitehall editors'; what = chamber + ' flip watch map'; note = 'A flip is a called race won by the other party';
      sw('Flipped, called · ' + flips, 'var(--dem)', { two: true, bg2: 'var(--rep)', rad2: '50%' });
      sw('Leader differs from holder, not called · ' + leads, 'transparent', { cls: 'hatch-d', two: true, cls2: 'hatch-r' });
      sw('Held, within 3 points · ' + tight, 'var(--zero)', { bd: '1.5px solid var(--ink)' }); sw('Held', 'var(--zero)');
      if (chamber === 'House') sw('Redrawn for 2026: not compared', 'transparent', { bd: '1.5px dotted var(--ink-3)' });
      if (replay) sw('Polls open', 'transparent', { bd: '1.5px dashed var(--ink-3)' });
    } else if (L === 'past') {
      tag = 'MIT Election Data and Science Lab · ' + c.geo + ' · final';
      heading = c.year + (c.geo === 'districts' ? ' House result by district' : ' presidential result by ' + unit);
      src = 'MIT Election Data and Science Lab, ' + (c.geo === 'districts' ? 'U.S. House returns' : 'presidential returns by ' + unit); asof = 'Nov 20, 2026, 2:08 AM ET'; what = heading; note = 'Not 2026 results';
      sw('Democrat by 15+', 'var(--d3)'); sw('5 to 15', 'var(--d2)'); sw('under 5', 'var(--d1)');
      sw('Republican by 15+', 'var(--r3)'); sw('5 to 15', 'var(--r2)'); sw('under 5', 'var(--r1)');
      if (c.geo === 'districts') sw('Won unopposed', 'var(--zero)', { cls: 'hatch-bg' });
      sw('Not reported', 'transparent', { bd: '1.5px dashed var(--ink-3)' });
    } else if (L === 'census') {
      const b = this.breaks(c.kind, c.metric);
      const f = (v) => this.fmt(c.metric, v);
      tag = 'Census ACS 2020–2024 five-year · ' + c.geo;
      heading = M[1] + ' by ' + unit;
      src = 'U.S. Census Bureau, American Community Survey 2020–2024 five-year estimates'; asof = 'Nov 20, 2026, 2:08 AM ET'; what = heading; note = 'Equal-count bins. Who lives there, not how it votes';
      sw(f(b[4]) + ' to ' + f(b[0]), 'var(--q1)'); sw('to ' + f(b[1]), 'var(--q2)'); sw('to ' + f(b[2]), 'var(--q3)'); sw('to ' + f(b[3]), 'var(--q4)'); sw('to ' + f(b[5]), 'var(--q5)');
      sw('No figure', 'transparent', { bd: '1.5px dashed var(--ink-3)' });
    } else if (L === 'tariff') {
      tag = 'Census · BEA · BLS via FRED · EIA · states';
      heading = 'Tariff exposure score by state';
      src = 'Census Bureau (imports), BEA (GDP), BLS via FRED (manufacturing jobs), EIA (diesel)'; asof = 'Nov 24, 2026'; what = 'Tariff exposure map'; note = 'Imports ÷ GDP, China, Mexico and Canada share, manufacturing jobs, diesel. Exposure, not a cost';
      ['0 to 20', '20 to 40', '40 to 60', '60 to 80', '80 to 100'].forEach((t, i) => sw(t, 'var(--q' + (i + 1) + ')'));
      sw('Not scored', 'transparent', { bd: '1.5px dashed var(--ink-3)' });
    }
    if (anyRedist && (L === 'results' || L === 'market' || L === 'holder' || L === 'flip')) {
      sw('Dashed state outline: redrawn for 2026', 'transparent', { bd: '1.8px dashed var(--ink)' });
      notes.push({ cls: 'chip dash', text: 'Shapes are the 2024 district lines' });
      notes.push({ cls: '', text: 'Alabama, California, Florida, Louisiana, Missouri, North Carolina, Ohio, Tennessee, Texas and Utah drew new districts for 2026. The Census Bureau has not published those shapes, so the numbers are for the 2026 districts and the outlines are 2024’s.' });
    }
    if (c.geo === 'counties' && !(c.extra && L === c.extra.id)) {
      notes.push({ cls: 'chip dash', text: 'County shapes are 2017' });
      notes.push({ cls: '', text: (c.fell ? 'Counties have no 2026 race of their own, so the map moved to Past results. ' : '') + 'Connecticut is drawn with its 8 former counties; its figures are reported by planning region since 2022.' });
    } else if (c.fell === 'tariff') notes.push({ cls: '', text: 'Tariff exposure is scored by state only, so the map moved to Results.' });
    if (replay && c.geo !== 'counties' && (L === 'results' || L === 'flip') && T >= 29 && T <= 32) notes.push({ cls: 'chip dot', text: 'County detail missing 1:15 to 2:00 AM; statewide totals and calls continued' });

    /* tooltip and selection readout */
    const hov = st.hover && g.by[st.hover] ? this.describe(g.by[st.hover], c) : null;
    const selF = c.sel && g.by[c.sel];
    const sel = selF ? this.describe(selF, c) : null;
    const canOpen = !!(selF && p.onOpen && (selF.kind !== 's' || (W.S[selF.id] && W.S[selF.id].sen !== '-')));
    this.queueDraw();
    return {
      pad: p.embedded ? '0' : '0', uid: this.uid(), tipId: this.uid() + 't',
      setCanvas: (el) => { if (el) { this._cv = el; } },
      tag, heading, layers,
      geos: [['states', 'States'], ['districts', 'Districts'], ['counties', 'Counties']].map((x) => ({ label: x[1], pressed: pressed(c.geo === x[0]), pick: setGeo(x[0]) })),
      frameStyle: (p.height ? Math.max(240, +p.height) : 460) + 'px',
      isCensus: L === 'census', metric: c.metric, onMetric: (e) => this.setState({ metric: e.target.value }),
      isPastYear: L === 'past' && c.geo !== 'districts', year: String(c.year), onYear: (e) => this.setState({ year: e.target.value }),
      zoomIn: () => this.zoomAt(1.7), zoomOut: () => this.zoomAt(1 / 1.7),
      reset: () => { this._touched = false; this.home(); this.queueDraw(); },
      goL48: () => { this._touched = true; this.fitBounds(WH_L48, 10); this.queueDraw(); },
      goAK: () => { this._touched = true; this.fitBounds(WH_AK, 10); this.queueDraw(); },
      goHI: () => { this._touched = true; this.fitBounds(WH_HI, 30); this.queueDraw(); },
      legend, notes, hasNotes: notes.length > 0,
      tipCls: hov ? 'mp-tip on' : 'mp-tip', hintCls: st.hint ? 'mp-hint on' : 'mp-hint',
      tipOn: !!hov, tipTitle: hov ? hov.title : '', tipLines: hov ? hov.lines.map((t) => ({ t })) : [],
      hintOn: !!st.hint, hint: st.hint || '',
      selOn: !!sel, selNone: !sel, selTitle: sel ? sel.title : '', selTag: sel ? sel.tag : '', selLines: sel ? sel.lines.map((t) => ({ t })) : [],
      canOpen, openLabel: selF && selF.kind === 'c' ? 'Open the place profile' : 'Open the race page',
      open: () => { if (p.onOpen && selF) p.onOpen({ id: selF.id, name: selF.name, kind: selF.kind, state: selF.st }); },
      clearSel: () => { this.setState({ sel: '' }); const cb = this.props.onPick; if (cb) cb(null); },
      mapAria: heading + ', by ' + unit + '. As of ' + asof + '. The table and the selection readout under the map carry the same figures as text.',
      src, asof, what, note
    };
  }
}

</script>
